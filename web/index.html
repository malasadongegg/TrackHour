    </style>
    <link

    />
  </head>
  <body>
    <div id="root"><p id="boot" role="status">Loading TrackHour...</p></div>
    <noscript><p style="padding:48px 16px;text-align:center;font:14px system-ui,sans-serif;color:#c7d5e0">TrackHour needs JavaScript to read your export in your browser.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>

</html>
