<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TrackHour</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>TrackHour</h1>
    <p class="sub" id="state">Loading</p>

    <table>
      <thead>
        <tr><th></th><th>Today</th><th>All time</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="note" id="empty" hidden>Nothing tracked yet. Use one of the supported sites and reopen this.</p>
    <p class="note" id="count"></p>

    <div class="row">
      <button id="pause" type="button">Pause tracking</button>
      <button id="export" type="button">Export file</button>
    </div>
    <button id="clear" type="button" class="danger">Delete all tracked time</button>

    <p class="note">
      Counts only time you are active in a focused tab. Never reads your chats. Open the TrackHour site and it imports
      this automatically.
    </p>
    <p class="note" id="sites"></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
